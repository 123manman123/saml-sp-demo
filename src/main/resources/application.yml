server:
  port: 7575

spring:
  application:
    name: saml-sp-demo
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

# SAML SP 配置（通过代码配置，此处仅保留基本配置）
saml:
  sp:
    entity-id: "samlTest"
    acs-location: "http://localhost:7575/login/saml2/sso/ngiam"
  idp:
    entity-id: "idp.jingantech.com"
    sso-url: "http://sso.n.jingantech.com/access-app-sso/v8/web/login/sso?appCode=samlTest&tenant=admin33"

# 日志配置
logging:
  level:
    org.springframework.security.saml2: DEBUG
    org.opensaml: DEBUG
    com.jingantech: DEBUG
